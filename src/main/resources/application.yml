spring:
  application:
    name: car-marketplace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/car_market}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/changelog/changes

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
